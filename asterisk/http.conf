; Servidor HTTP de Asterisk: lo usan ARI (backend) y WebSocket seguro (softphones WebRTC).
[general]
enabled=yes

; HTTP plano solo en localhost: ARI no se expone a la red
bindaddr=127.0.0.1
bindport=8088

; HTTPS/WSS para los softphones de los agentes (wss://IP:8089/ws)
tlsenable=yes
tlsbindaddr=0.0.0.0:8089
tlscertfile=/etc/discador/tls/servidor-cadena.crt
tlsprivatekey=/etc/discador/tls/servidor.key
