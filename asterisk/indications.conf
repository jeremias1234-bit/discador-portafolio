; Tonos de la red telefónica. El discador usa el tono de llamada de Argentina para las
; llamadas manuales (lo que escucha el vendedor mientras suena del otro lado).
; ARI lo pide como 'tone:ring;tonezone=ar' (el media de ARI no admite comas en el tono).
[general]
country=ar

; Argentina (ITU-T E.180): 425 Hz
[ar]
description = Argentina
ringcadence = 1000,4500
dial = 425
busy = 425/300,0/200
ring = 425/1000,0/4000
congestion = 425/200,0/300
callwaiting = 425/200,0/9000
dialrecall = !425/100,!0/100,!425/100,!0/100,!425/100,!0/100,425
record = 1400/500,0/15000
info = 950/330,1400/330,1800/330,0/1000
