; Dialplan mínimo: la lógica vive en el backend.
; Asterisk solo entrega los canales a la aplicación ARI "discador" (Stasis).

[general]
static=yes
writeprotect=yes

; ---------------------------------------------------------------------
; Lo que marcan los softphones de los agentes
; ---------------------------------------------------------------------
[agentes]
; 9000 = línea siempre abierta: el vendedor (o el supervisor) queda en su bridge esperando llamadas
exten => 9000,1,NoOp(Línea abierta de ${CHANNEL(endpoint)})
 same => n,Stasis(discador,linea,${CHANNEL(endpoint)})
 same => n,Hangup()
; Cualquier otro número = llamada manual desde un softphone sin línea abierta
exten => _X.,1,NoOp(${CHANNEL(endpoint)} marca ${EXTEN})
 same => n,Stasis(discador,manual,${CHANNEL(endpoint)},${EXTEN})
 same => n,Hangup()

; ---------------------------------------------------------------------
; Llamadas entrantes desde los gateways.
; Por ahora se rechazan; el IVR entrante se agrega más adelante.
; ---------------------------------------------------------------------
[desde-gateways]
exten => _X.,1,NoOp(Entrante por ${CHANNEL(endpoint)} hacia ${EXTEN})
 same => n,Hangup(21)
exten => s,1,NoOp(Entrante por ${CHANNEL(endpoint)} sin número destino)
 same => n,Hangup(21)
; El keepalive del SIP Trunk del Dinstar manda OPTIONS a sip:heartbeat@servidor;
; con esta extensión Asterisk responde 200 en lugar de 404.
exten => heartbeat,1,Hangup(21)

; ---------------------------------------------------------------------
; Detección de contestador.
; AMD() es una aplicación de dialplan, no existe en ARI: cuando el cliente
; contesta, el backend manda el canal acá (continueInDialplan) y AMD lo
; devuelve a Stasis con el resultado (HUMAN, MACHINE, NOTSURE, HANGUP).
; ---------------------------------------------------------------------
; AMD_PARAMS la define el backend con los valores del panel (amd.* en configuracion), en el
; orden que espera AMD(): silencio inicial, saludo, silencio tras saludo, análisis total,
; palabra mínima, silencio entre palabras, palabras máximas, umbral de silencio, palabra máxima.
[amd]
; AMD_GRABAR (si viene) = archivo donde se graba la detección, para revisar después si el AMD acertó.
; Va en el directorio de grabaciones de ARI: el backend la sirve y la borra como las demás.
exten => s,1,ExecIf($["${AMD_GRABAR}" != ""]?MixMonitor(${AMD_GRABAR}))
 same => n,AMD(${AMD_PARAMS})
 same => n,ExecIf($["${AMD_GRABAR}" != ""]?StopMixMonitor())
 same => n,Stasis(discador,amd,${AMDSTATUS},${AMDCAUSE})
 same => n,Hangup()
