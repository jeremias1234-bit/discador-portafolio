; =====================================================================
;  SOLO DESARROLLO: banco de pruebas del discador sin teléfonos reales.
;  NUNCA copiar a producción. Instalación y uso: docs/PRUEBAS.md
;
;  Se incluye al final de /etc/asterisk/extensions.conf (#include dev/simulador.conf)
;  y en [desde-gateways] se agrega:
;    exten => _999XXXXXXX,1,Goto(simulador,${EXTEN},1)
;  El gateway "simulador" (IP 127.0.0.1, creado desde el panel) hace que las llamadas
;  del motor vuelvan a entrar a este mismo Asterisk.
;  Para probar con bases de 10 dígitos sin llamar a nadie, también en [desde-gateways]:
;    exten => _XXXXXXXXXX,1,GotoIf($["${CHANNEL(endpoint)}" = "simulador"]?simulador-azar,${EXTEN},1)
;     same => n,Hangup(21)
;  Solo desvía lo que vuelve por el gateway simulador; lo que entra por un Dinstar sigue rechazándose.
; =====================================================================
[simulador]
; 99900001NN: persona: saluda corto y se queda en línea
exten => _99900001XX,1,Answer()
 same => n,Wait(0.5)
 same => n,Playback(beep)
 same => n,Wait(120)
; 99900002NN: contestador: mensaje largo sin pausas
exten => _99900002XX,1,Answer()
 same => n,Playback(vm-intro&vm-intro&vm-intro)
 same => n,Wait(30)
; 99900003NN: ocupado
exten => _99900003XX,1,Busy(5)
; 99900004NN: no contesta (suena hasta el timeout)
exten => _99900004XX,1,Ringing()
 same => n,Wait(120)
; 99900008NN: audio de la red mientras suena (183 con audio, como el Dinstar) y no atiende
exten => _99900008XX,1,Progress()
 same => n,Playback(vm-intro,noanswer)
 same => n,Playback(vm-intro,noanswer)
 same => n,Wait(30)
; 99900005NN: persona que aprieta 1 a los 2 segundos
exten => _99900005XX,1,Answer()
 same => n,Wait(0.5)
 same => n,Playback(beep)
 same => n,Wait(2)
 same => n,SendDTMF(1)
 same => n,Wait(120)
; 99900006NN: aprieta 3 (No Llame)
exten => _99900006XX,1,Answer()
 same => n,Wait(0.5)
 same => n,Playback(beep)
 same => n,Wait(2)
 same => n,SendDTMF(3)
 same => n,Wait(30)
; 99900009NN: aprieta 2 a los 2 segundos (en el IVR con aviso: quiere WhatsApp)
exten => _99900009XX,1,Answer()
 same => n,Wait(0.5)
 same => n,Playback(beep)
 same => n,Wait(2)
 same => n,SendDTMF(2)
 same => n,Wait(30)
; 99900007NN: atiende y corta enseguida
exten => _99900007XX,1,Answer()
 same => n,Wait(1)
 same => n,Hangup()

; Cliente al azar para cualquier otro número (bases reales cargadas para probar, sin llamar a nadie):
;   40 % persona que se queda entre 10 s y 10 min, 15 % contestador, 10 % ocupado, 35 % no contesta
[simulador-azar]
exten => _X.,1,Set(SUERTE=${RAND(1,100)})
 same => n,GotoIf($[${SUERTE} <= 35]?no_contesta)
 same => n,GotoIf($[${SUERTE} <= 45]?ocupado)
 same => n,GotoIf($[${SUERTE} <= 60]?contestador)
 same => n,Wait(${RAND(2,8)})
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Playback(beep)
 same => n,Wait(${RAND(10,600)})
 same => n,Hangup()
 same => n(no_contesta),Ringing()
 same => n,Wait(120)
 same => n(ocupado),Wait(${RAND(1,3)})
 same => n,Busy(5)
 same => n(contestador),Wait(${RAND(3,10)})
 same => n,Answer()
 same => n,Playback(vm-intro&vm-intro&vm-intro)
 same => n,Wait(30)

; Vendedores simulados: Local/ag-<interno>@prueba-linea abre la línea como si marcara 9000
[prueba-linea]
exten => _ag-X.,1,Stasis(discador,linea,${EXTEN:3})
 same => n,Hangup()
