; =====================================================================
;  Transportes
; =====================================================================
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; WebRTC: usa el servidor HTTPS de Asterisk (http.conf, puerto 8089)
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0

; =====================================================================
;  Plantillas
; =====================================================================

; Gateways Dinstar: trunk por IP, sin registro ni clave.
; En el Dinstar: SIP Trunk con la IP del servidor y KeepAlive activado.
; Asterisk le manda las llamadas al contact fijo y reconoce lo que entra por la IP (identify).
[dinstar](!)
type=endpoint
transport=transport-udp
context=desde-gateways
disallow=all
allow=alaw,ulaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
dtmf_mode=rfc4733
rtp_timeout=60                  ; sin audio 60 s con la llamada atendida = canal muerto, se corta

[dinstar-aor](!)
type=aor
qualify_frequency=30            ; OPTIONS cada 30 s: estado Avail/Unavailable

[dinstar-identify](!)
type=identify

; Softphones WebRTC de agentes. webrtc=yes activa DTLS, ICE, AVPF y rtcp-mux.
[agente-webrtc](!)
type=endpoint
transport=transport-wss
context=agentes
disallow=all
allow=alaw,ulaw
webrtc=yes
; Si la PC del vendedor se cuelga o pierde la red, el navegador no llega a mandar BYE y la línea
; quedaría abierta con el cliente hablándole a nadie. El navegador manda audio siempre (también
; en silencio o silenciado), así que 20 s sin audio = el vendedor ya no está: se corta la línea.
rtp_timeout=20

[agente-aor](!)
type=aor
max_contacts=1
remove_existing=yes

; Softphone externo (MicroSIP u otro) por UDP en la LAN
[agente-udp](!)
type=endpoint
transport=transport-udp
context=agentes
disallow=all
allow=alaw,ulaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
rtp_timeout=20                  ; ver agente-webrtc (desactivar la supresión de silencio del softphone)

[auth-userpass](!)
type=auth
auth_type=userpass

; =====================================================================
;  Gateways e internos de los usuarios: los genera el backend desde la base
;  (tablas gateways y usuarios) y recarga res_pjsip. No editar ese archivo a mano.
; =====================================================================
#include pjsip_discador.conf
