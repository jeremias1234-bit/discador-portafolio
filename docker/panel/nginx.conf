# Panel del discador: https://IP_DEL_SERVIDOR:5173
map $http_upgrade $conexion_upgrade {
  default upgrade;
  ''      close;
}
# La extensión de Chrome llama a la API desde chrome-extension://
map $http_origin $origen_extension {
  default '';
  '~^chrome-extension://' $http_origin;
}

server {
  listen 5173 ssl;
  http2 on;
  ssl_certificate     /etc/discador/tls/servidor-cadena.crt;
  ssl_certificate_key /etc/discador/tls/servidor.key;

  root /usr/share/nginx/html;
  client_max_body_size 250m;   # bases CSV y padrón No Llame

  location /api/ {
    add_header Access-Control-Allow-Origin $origen_extension always;
    add_header Access-Control-Allow-Headers 'Authorization, Content-Type' always;
    add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    if ($request_method = OPTIONS) { return 204; }

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $conexion_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_request_buffering off;
  }

  location /assets/ {
    expires 30d;
  }

  location / {
    try_files $uri /index.html;
  }
}
